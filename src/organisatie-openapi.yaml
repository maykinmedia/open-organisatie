components:
  schemas:
    BlankEnum:
      enum:
      - ''
    Functie:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
          description: Unieke resource identifier (UUID4) voor deze functie.
        externalId:
          type: string
          description: Externe identifier voor deze functie.
          maxLength: 255
        functieOmschrijving:
          type: string
          description: Korte omschrijving of titel van de functie.
          maxLength: 255
        startdatum:
          type: string
          format: date
          nullable: true
          description: De datum waarop de functie ingaat.
        einddatum:
          type: string
          format: date
          nullable: true
          description: De datum waarop de functie eindigt.
        wijzigingsdatum:
          type: string
          format: date-time
          nullable: true
          description: De datum waarop de functie gewijzigd is.
        functieType:
          allOf:
          - $ref: '#/components/schemas/FunctieType'
          readOnly: true
          description: Het type functie dat hieraan gekoppeld is.
        functietypeUuid:
          type: string
          format: uuid
          writeOnly: true
          description: UUID van de gekoppelde functietype.
        medewerker:
          allOf:
          - $ref: '#/components/schemas/Medewerker'
          readOnly: true
        medewerkerUuid:
          type: string
          format: uuid
          writeOnly: true
          description: UUID van de gekoppelde medewerker.
        teams:
          type: array
          items:
            $ref: '#/components/schemas/TeamGroupPeriods'
          readOnly: true
        teamsInput:
          type: array
          items:
            $ref: '#/components/schemas/FunctieTeamWrite'
          writeOnly: true
        organisatorischeEenheden:
          type: array
          items:
            $ref: '#/components/schemas/OrganisatorischeEenheidGroupPeriods'
          readOnly: true
        organisatorischeEenhedenInput:
          type: array
          items:
            $ref: '#/components/schemas/OrganisatorischeEenheidFunctieWrite'
          writeOnly: true
      required:
      - functieOmschrijving
      - functieType
      - functietypeUuid
      - medewerker
      - organisatorischeEenheden
      - teams
      - uuid
    FunctieTeamWrite:
      type: object
      properties:
        teamUuid:
          type: string
          format: uuid
          writeOnly: true
        geldigheid:
          type: object
          required:
          - beginGeldigheid
          properties:
            beginGeldigheid:
              type: string
              format: date
            eindeGeldigheid:
              type: string
              format: date
              nullable: true
          example:
            beginGeldigheid: '2025-01-01'
            eindeGeldigheid: '2025-06-01'
          writeOnly: true
      required:
      - geldigheid
      - teamUuid
    FunctieType:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
          description: Unieke resource identifier (UUID4) voor dit functietype.
        externalId:
          type: string
          description: Externe identifier voor deze functietype.
          maxLength: 255
        naam:
          type: string
          description: De naam van het functietype (bijv. Manager, Medewerker).
          maxLength: 50
        slug:
          type: string
          description: Unieke, URL-vriendelijke identificatie voor dit functietype.
          maxLength: 100
          pattern: ^[-a-zA-Z0-9_]+$
      required:
      - naam
      - slug
      - uuid
    GeslachtsaanduidingEnum:
      enum:
      - M
      - V
      - X
      type: string
      description: |-
        * `M` - Man
        * `V` - Vrouw
        * `X` - Anders
    Medewerker:
      type: object
      properties:
        url:
          type: string
          format: uri
          readOnly: true
          minLength: 1
          maxLength: 1000
          description: URL-referentie naar dit object. Dit is de unieke identificatie
            en locatie van dit object.
        uuid:
          type: string
          format: uuid
          readOnly: true
          description: Unieke resource identifier (UUID4)
        externalId:
          type: string
          description: Externe identifier voor deze medewerker.
          maxLength: 255
        medewerkerId:
          type: string
          description: ID van de medewerker.
          maxLength: 50
        voornaam:
          type: string
          description: Voornaam van de medewerker.
          maxLength: 100
        achternaam:
          type: string
          description: Achternaam van de medewerker.
          maxLength: 100
        emailadres:
          type: string
          format: email
          description: E-mailadres van de medewerker.
          maxLength: 254
        telefoonnummer:
          type: string
          description: Telefoonnummer van de medewerker (optioneel).
          maxLength: 30
        geslachtsaanduiding:
          description: |-
            Geslachtsaanduiding (optioneel).

            * `M` - Man
            * `V` - Vrouw
            * `X` - Anders
          oneOf:
          - $ref: '#/components/schemas/GeslachtsaanduidingEnum'
          - $ref: '#/components/schemas/BlankEnum'
