            - beginGeldigheid
            properties:
              beginGeldigheid:
                type: string
                format: date
              eindeGeldigheid:
                type: string
                format: date
                nullable: true
            example:
              beginGeldigheid: '2025-01-01'
              eindeGeldigheid: '2025-06-01'
        wijzigingsdatum:
          type: string
          format: date-time
          readOnly: true
      required:
      - geldigheid
      - team
      - wijzigingsdatum
    Vestiging:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
          description: Unieke resource identifier (UUID4)
        externalId:
          type: string
          description: Externe identifier voor deze vestiging.
          maxLength: 255
        vestigingsnummer:
          type: string
          description: Unieke identificatiecode of nummer van de vestiging.
          maxLength: 50
        naam:
          type: string
          description: Volledige naam van de vestiging.
          maxLength: 100
        adres:
          type: string
          description: Fysiek adres van de vestiging (optioneel).
          maxLength: 255
        correspondentieadres:
          type: string
          description: Adres voor correspondentie (optioneel).
          maxLength: 255
        postAdres:
          type: string
          description: Post adres van de vestiging (optioneel).
          maxLength: 255
        telefoonnummer:
          type: string
          description: Telefoonnummer van de vestiging (optioneel).
          maxLength: 50
      required:
      - naam
      - uuid
  securitySchemes:
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
servers:
- url: /organisatie/api/v0
